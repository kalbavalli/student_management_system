<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Student</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><main class="container narrow"><section class="card"><small>UPDATE RECORD</small><h1>Edit Student</h1>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="alert {{c}}">{{m}}</div>{% endfor %}{% endwith %}<form method="post" class="grid"><input name="student_id" value="{{student.student_id}}" required><input name="name" value="{{student.name}}" required><input name="email" type="email" value="{{student.email}}" required><input name="department" value="{{student.department}}" required><select name="year" required>{% for y in range(1,5) %}<option value="{{y}}" {% if student.year==y %}selected{% endif %}>{{y}}</option>{% endfor %}</select><input name="phone" value="{{student.phone}}" required><button>Save Changes</button></form><a href="/">← Back</a></section></main></body></html>
